name: security

# Security engineering pipeline for RollCall AI.
#
# Every job is independent and read-only with respect to production: no
# migration is applied to a live database, no credential is provisioned here and
# no deployment configuration is touched.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  PIP_AUDIT_VERSION: "2.9.0"
  BANDIT_VERSION: "1.8.3"
  # gitleaks CLI is installed directly so the scan does not depend on the
  # gitleaks-action license/version inputs. The archive is checksum-verified.
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_LINUX_X64_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  # ---------------------------------------------------------------------
  # 1. Secret scanning (gitleaks)
  # ---------------------------------------------------------------------
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: |
          # Scans the full history (fetch-depth: 0). Findings fail the job;
          # output is redacted so no secret is written to the workflow log.
          ./gitleaks detect --source . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1

  # ---------------------------------------------------------------------
  # 2. Python dependency vulnerabilities (pip-audit)
  # ---------------------------------------------------------------------
  python-dependency-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Audit the backend requirements
        working-directory: backend
        run: |
          python -m pip_audit -r requirements.txt --strict

  # ---------------------------------------------------------------------
  # 3. Static analysis (bandit)
  # ---------------------------------------------------------------------
  python-static-analysis:
    name: Python static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install "bandit==${BANDIT_VERSION}"

      - name: Run bandit
        working-directory: backend
        run: |
          # Medium and high severity findings fail the job; low severity is reported.
          python -m bandit -r app tools -ll

  # ---------------------------------------------------------------------
  # 4. Backend tests
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        working-directory: backend
        run: python -m pytest tests -q --timeout=600

  # ---------------------------------------------------------------------
  # 5. Frontend checks (TypeScript + ESLint) - source is never modified
  # ---------------------------------------------------------------------
  frontend-checks:
    name: Frontend type-check and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compilation
        run: npx tsc -b --pretty false

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------
  # 6. Security scan script (adversarial suite + dependency gate)
  #
  # Runs the same script developers run locally. pytest is skipped here
  # because job 4 already runs the full backend suite; everything else (bandit,
  # pip-audit, gitleaks, npm audit, the 57-probe attack suite) must pass.
  # ---------------------------------------------------------------------
  security-scan-script:
    name: Security scan script (attack suite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install backend and security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pip install "bandit==${BANDIT_VERSION}" "pip-audit==${PIP_AUDIT_VERSION}"

      - name: Install gitleaks CLI
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci

      - name: Run the security scan script
        # -SkipPytest: job 4 runs pytest; the adversarial probe suite does not
        # run anywhere else and is the reason this job exists.
        run: pwsh -File scripts/security-scan.ps1 -SkipPytest

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            reports/person1_attack_results.json
            reports/security-scan-summary.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------
  # 7. Dependency and migration integrity
  # ---------------------------------------------------------------------
  dependency-and-migration-checks:
    name: Dependency and migration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check installed dependency consistency
        working-directory: backend
        run: python -m pip check

      - name: Verify a single Alembic head and a clean migration path
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import tempfile
          from alembic import command
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          EXPECTED_HEAD = "0019_user_profiles"

          config = Config("alembic.ini")
          # ``command.heads()`` only prints and returns None, so read the heads
          # from the script directory instead.
          heads = ScriptDirectory.from_config(config).get_heads()
          if heads != [EXPECTED_HEAD]:
              raise SystemExit(
                  f"Expected exactly one Alembic head ({EXPECTED_HEAD}), found: {heads}"
              )

          with tempfile.TemporaryDirectory() as tmp:
              db_path = os.path.join(tmp, "ci_migration_check.db").replace("\\", "/")
              config.set_main_option("sqlalchemy.url", f"sqlite:///{db_path}")
              command.upgrade(config, "head")
              command.downgrade(config, "base")
              command.upgrade(config, "head")
          print("Migration path verified on a disposable database.")
          PY

  # ---------------------------------------------------------------------
  # 8. Redis rate limiting against a real server
  #
  # The fake-client unit tests cover the logic; this job proves the Lua scripts
  # and shared counters work against an actual Redis, which is what multi-
  # instance deployments rely on. The test module skips when REDIS_URL is unset,
  # so the regular suite is unaffected.
  # ---------------------------------------------------------------------
  redis-rate-limit-integration:
    name: Redis rate limiting (real server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install the backend and test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the Redis integration tests
        working-directory: backend
        run: python -m pytest tests/test_redis_integration.py -q
