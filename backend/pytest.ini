[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore:.*'HTTP_413_REQUEST_ENTITY_TOO_LARGE' is deprecated.*:Warning
    ignore:.*'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:Warning
    ignore:.*'pin_memory' argument is set as true.*:UserWarning
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*:Warning
    ignore:.*httpx.*is deprecated.*:Warning
    ignore:.*All support for the `google.generativeai` package has ended.*:FutureWarning
markers =
    no_auth_override: run the test with real JWT verification instead of the conftest mock user
