server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: rollcall-security-events
    static_configs:
      - targets: [localhost]
        labels:
          job: rollcall-security
          app: rollcall
          __path__: /var/log/rollcall/security-events.jsonl
    pipeline_stages:
      - json:
          expressions:
            event_type: event_type
            severity: severity
            outcome: outcome
            actor_id: actor_id
            ip_address: ip_address
      - labels:
          event_type:
          severity:
          outcome:
      - timestamp:
          source: timestamp
          format: RFC3339
