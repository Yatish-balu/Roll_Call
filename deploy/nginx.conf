# RollCall AI - production reverse proxy.
#
# Terminates TLS, forwards the real client address/protocol to FastAPI, applies
# an edge rate limit, and rejects oversized uploads. The application also sends
# these security headers; they are repeated here so they are present even on
# responses generated by nginx itself (4xx/5xx, redirects).
#
# Replace rollcall.example.edu and the certificate paths before deploying.

limit_req_zone $binary_remote_addr zone=rollcall_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rollcall_login:10m rate=1r/s;

upstream rollcall_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name rollcall.example.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rollcall.example.edu;

    ssl_certificate     /etc/letsencrypt/live/rollcall.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rollcall.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads are capped at 10 MB by the application; allow a small envelope.
    client_max_body_size 12m;
    client_body_timeout 30s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    # The API docs describe the entire attack surface; production must not serve
    # them. The application already builds with docs_url=None when APP_ENV is
    # production - this is the edge backstop.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }

    location = /api/v1/auth/login {
        limit_req zone=rollcall_login burst=5 nodelay;
        proxy_pass http://rollcall_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location / {
        limit_req zone=rollcall_api burst=40 nodelay;
        proxy_pass http://rollcall_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Only set this because a trusted proxy is terminating TLS; the app reads
        # it for HSTS and per-IP rate limiting (TRUST_PROXY_HEADERS=true).
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
