# RollCall AI - reverse proxy (Nginx) example
#
# Terminates TLS, redirects HTTP to HTTPS, applies the Person 2 security
# headers and proxies /api + /health to FastAPI while serving the React build.
#
# Replace app.example.com and the certificate paths with your real values.
# Keep this file in sync with backend/app/security/headers.py: the edge is the
# primary control and the application headers are the safety net.

upstream rollcall_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limiting at the edge (defense in depth; the app also rate limits).
limit_req_zone $binary_remote_addr zone=rollcall_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=rollcall_uploads:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # ACME challenge can stay on HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # Security headers (Person 2, Phase 1)
    # ------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; script-src 'self'; style-src 'self'; connect-src 'self' https://app.example.com; font-src 'self' data:; form-action 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    server_tokens off;

    # Uploads: keep in step with MAX_UPLOAD_SIZE (10 MB) in the app.
    client_max_body_size 10m;

    # ------------------------------------------------------------------
    # React/Vite static build
    # ------------------------------------------------------------------
    root /var/www/rollcall/frontend;
    index index.html;

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # FastAPI
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=rollcall_api burst=40 nodelay;
        proxy_pass http://rollcall_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploads are slower and separately limited.
    location ~ ^/api/(v1/)?agent/process-file$ {
        limit_req zone=rollcall_uploads burst=5 nodelay;
        proxy_pass http://rollcall_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://rollcall_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Never proxy these to the app.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
