# Local development services for RollCall AI.
#
# Redis backs the shared rate limiter (login/reset/MFA/upload quotas and the
# chat/report endpoints) so a local multi-worker run behaves like production.
# The application falls back to the database counters when REDIS_URL is unset.
#
#   docker compose up -d redis
#   # then set in .env:
#   REDIS_URL=redis://:rollcall-local-dev-redis@127.0.0.1:6379/0
#
# Port 6379 is bound to 127.0.0.1 only and Redis requires a password even for
# local development. Override REDIS_PASSWORD for a non-default local value.
# Production Redis must be authenticated and reached over TLS (managed service
# or private VPC).

services:
  redis:
    image: redis:7.4-alpine
    container_name: rollcall-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --requirepass
      - ${REDIS_PASSWORD:-rollcall-local-dev-redis}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rollcall-local-dev-redis}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
